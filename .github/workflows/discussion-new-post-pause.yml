# Pause new discussions from people without write access, while replies
# to existing discussions stay open.
#
# GitHub can limit issue creation to collaborators (Settings > Features >
# Issues), but it has no matching control for discussions short of
# switching every category to the Announcement format, which relabels
# every existing thread in it. This workflow does the rest: a new
# discussion from anyone outside the project gets a short explanation, is
# locked at once, and is deleted an hour later.
#
# Keep a post: unlock it within the hour. The delete step and the sweep
# both skip a discussion that is no longer locked.
#
# Lift the pause: disable this workflow in the Actions tab.
#
# Auth: ISSUE_BOT_TOKEN, the owner's token. Deleting a discussion needs
# admin rights, which GITHUB_TOKEN does not carry.
#
# The sweep runs every 15 minutes and deletes any paused discussion whose
# notice is over an hour old, so a cancelled or failed run cannot leave
# one behind. It touches a discussion only when all three hold: it is
# locked, its author is outside the project, and the owner's account
# posted the notice. Anyone can type the marker into a comment, so the
# marker alone would let a commenter mark any thread for deletion.

name: Pause new discussions

on:
  discussion:
    types: [created]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      discussion_number:
        description: 'Pause this discussion number whoever posted it (for testing). Leave empty to run the sweep.'
        required: false
        default: ''
      delay_seconds:
        description: 'Seconds to wait before deleting, on a test run'
        required: false
        default: '3600'

permissions:
  contents: read

env:
  MARKER: '<!-- padforge-new-discussion-pause -->'

jobs:
  pause:
    if: >-
      (github.event_name == 'discussion'
        && !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.discussion.author_association))
      || (github.event_name == 'workflow_dispatch' && inputs.discussion_number != '')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ secrets.ISSUE_BOT_TOKEN }}
      NUMBER: ${{ github.event.discussion.number || inputs.discussion_number }}
      DELAY: ${{ github.event_name == 'workflow_dispatch' && inputs.delay_seconds || '3600' }}
    steps:
      - name: Explain and lock
        run: |
          set -euo pipefail
          o="${GITHUB_REPOSITORY%/*}"; n="${GITHUB_REPOSITORY#*/}"
          id=$(gh api graphql \
            -f query='query($o:String!,$n:String!,$num:Int!){repository(owner:$o,name:$n){discussion(number:$num){id}}}' \
            -f o="$o" -f n="$n" -F num="$NUMBER" --jq .data.repository.discussion.id)
          echo "DISCUSSION_ID=$id" >> "$GITHUB_ENV"
          body=$(cat <<'NOTICE'
          Thanks for posting. New discussions are paused for now while work on the next release is underway, so this one is locked and will be removed in about an hour. Replies to existing discussions are still open. Please post it again once the pause lifts.

          <!-- padforge-new-discussion-pause -->
          NOTICE
          )
          gh api graphql \
            -f query='mutation($d:ID!,$b:String!){addDiscussionComment(input:{discussionId:$d,body:$b}){comment{id}}}' \
            -f d="$id" -f b="$body" > /dev/null
          gh api graphql \
            -f query='mutation($d:ID!){lockLockable(input:{lockableId:$d}){lockedRecord{locked}}}' \
            -f d="$id" > /dev/null
          echo "Discussion #$NUMBER locked with the notice."

      - name: Wait
        run: sleep "$DELAY"

      - name: Delete unless unlocked
        run: |
          set -euo pipefail
          locked=$(gh api graphql \
            -f query='query($d:ID!){node(id:$d){... on Discussion{locked}}}' \
            -f d="$DISCUSSION_ID" --jq '.data.node.locked // "gone"' 2>/dev/null || echo gone)
          if [ "$locked" != "true" ]; then
            echo "Discussion #$NUMBER is unlocked or already gone ($locked). Leaving it."
            exit 0
          fi
          gh api graphql \
            -f query='mutation($d:ID!){deleteDiscussion(input:{id:$d}){discussion{number}}}' \
            -f d="$DISCUSSION_ID" > /dev/null
          echo "Discussion #$NUMBER deleted."

  sweep:
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && inputs.discussion_number == '')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.ISSUE_BOT_TOKEN }}
    steps:
      - name: Delete paused discussions older than an hour
        run: |
          set -euo pipefail
          o="${GITHUB_REPOSITORY%/*}"; n="${GITHUB_REPOSITORY#*/}"
          now=$(date -u +%s)
          gh api graphql \
            -f query='query($o:String!,$n:String!){repository(owner:$o,name:$n){discussions(first:50,orderBy:{field:CREATED_AT,direction:DESC}){nodes{id number locked authorAssociation comments(first:10){nodes{body createdAt author{login}}}}}}}' \
            -f o="$o" -f n="$n" \
          | jq -r --arg m "$MARKER" --arg owner "$o" --argjson now "$now" '
              .data.repository.discussions.nodes[]
              | select(.locked)
              | select(.authorAssociation as $a | ["OWNER","MEMBER","COLLABORATOR"] | index($a) | not)
              | select([.comments.nodes[]
                        | select(.author.login == $owner and (.body | contains($m)))
                        | (.createdAt | fromdateiso8601)]
                       | length > 0 and min <= ($now - 3600))
              | "\(.id) \(.number)"' \
          | while read -r id num; do
              if gh api graphql \
                   -f query='mutation($d:ID!){deleteDiscussion(input:{id:$d}){discussion{number}}}' \
                   -f d="$id" > /dev/null; then
                echo "Deleted paused discussion #$num."
              else
                echo "Could not delete #$num, it may already be gone."
              fi
            done
